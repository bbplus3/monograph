[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monograph"
version = "0.1.1"
description = "Turn a personal diary into a memoir — explore it, find its arcs, draft it, and narrate it in your own voice. Local-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bonnie Bingham", email = "cashcam1@gmail.com" }]
keywords = ["diary", "memoir", "writing", "tts", "voice-cloning", "rag"]

# Core stays tiny and dependency-light. Heavy pieces are opt-in extras so the
# library installs small and runs local-first; a user only pulls the backend
# they actually use.
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
ingest = ["python-docx>=0.8"]                                 # read .docx diaries
index = ["sentence-transformers>=2.2"]                        # local embeddings (store is numpy; no faiss)
arc = ["pandas>=1.5", "scikit-learn>=1.1"]                    # signal extraction + clustering
narrate = ["soundfile>=0.12"]                                 # shared audio I/O
mp3 = ["monograph[narrate]", "lameenc>=1.7"]                  # bind -> .mp3 (self-contained, no ffmpeg)
narrate-f5 = ["monograph[narrate]", "f5-tts>=1.0"]
narrate-xtts = ["monograph[narrate]", "coqui-tts>=0.24"]
llm-ollama = []                                               # local LLM via stdlib HTTP (just run Ollama)
llm-openai = ["openai>=1.0"]
app = ["streamlit>=1.30"]
dev = ["pytest>=7", "soundfile>=0.12", "lameenc>=1.7", "pandas>=1.5", "scikit-learn>=1.1", "python-docx>=0.8"]
all = ["monograph[ingest,index,arc,narrate-f5,mp3,app,dev]"]

[project.scripts]
monograph = "monograph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/monograph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/bbplus3/monograph"
Repository = "https://github.com/bbplus3/monograph"
Issues = "https://github.com/bbplus3/monograph/issues"
